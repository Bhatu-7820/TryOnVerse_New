services:
  # ─── 1. Backend Web Service (Node.js Express + Socket.IO) ───
  - type: web
    name: tryonverse-backend
    env: node
    rootDir: traveloop-backend
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: FRONTEND_URL
        sync: false

  # ─── 2. Frontend Static Site (Vite React SPA) ───
  - type: web
    name: tryonverse-frontend
    env: static
    rootDir: traveloop-frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
